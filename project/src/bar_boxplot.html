<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choropleth Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
    }
    nav {
      background-color: #0056b3;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    nav a {
      color: #ffffff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    nav a:hover {
      background-color: #003d80;
      transform: scale(1.1);
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 36px;
      color: #333;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
    }
    #controls {
      display: flex;
      justify-content: center;
      margin: 20px auto;
      gap: 20px;
      padding: 10px;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
      max-width: 90%;
    }
    #controls label {
      font-size: 16px;
      color: #333;
      font-weight: bold;
    }
    #controls select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: box-shadow 0.3s ease;
    }
    #controls select:focus {
      box-shadow: 0 0 5px rgba(0,123,255,0.5);
      outline: none;
    }
    #chart {
      margin: 30px auto;
      width: 95%;
      height: 700px;
      border: 1px solid #ccc;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .tooltip {
      position: absolute;
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    .tooltip.visible {
      display: block;
      opacity: 1;
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tsp.html">Time Series Plot</a>
    <a href="map.html">Choropleth Map</a>
    <a href="scatterplot.html">Scatter Plot & Bubble Chart</a>
    <a href="bar_boxplot.html">Bar Chart & Box Plot</a>
  </nav>
  <h1>Choropleth Map</h1>
  <div id="controls">
    <label>
      Select Year:
      <select id="yearSelect"></select>
    </label>
    <label>
      Select Measure:
      <select id="measureSelect"></select>
    </label>
  </div>
  <div id="chart"></div>

  <script>

  </script>
</body>
</html>
